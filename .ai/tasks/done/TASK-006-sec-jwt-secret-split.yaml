id: TASK-006
title: "SEC-03: Tách riêng Secret giữa Access Token và Refresh Token, bổ sung kiểm tra token type"
owner: antigravity
status: done
priority: high
category: security
dependencies: []

files_allowed:
  - backend-nestjs/src/auth/auth.service.ts
  - backend-nestjs/src/auth/auth.module.ts
  - backend-nestjs/src/auth/strategies/jwt.strategy.ts
  - backend-nestjs/src/auth/strategies/jwt-refresh.strategy.ts
  - backend-nestjs/src/auth/auth.service.spec.ts

files_forbidden:
  - frontend/**

acceptance_criteria:
  - Access Token và Refresh Token sử dụng 2 secret key độc lập hoặc kiểm tra type trong JWT payload
  - JwtStrategy từ chối nếu token truyền vào có type === 'refresh'
  - Gửi Refresh Token vào Authorization header hoặc access cookie bị từ chối 401 Unauthorized
  - Quy trình Refresh Token tại /api/auth/refresh hoạt động bình thường và cấp phát cặp token mới

commands:
  test:
    - cd backend-nestjs && npm run test -- auth
  typecheck:
    - cd backend-nestjs && npx tsc --noEmit

max_fix_cycles: 5
